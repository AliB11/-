<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070f" />

  <title>بانک‌رادار | مقایسه حرفه‌ای محصولات بانکی ایران با بازده حقیقی</title>
  <meta name="description" content="مقایسه و رتبه‌بندی محصولات منابعی، اعتباری، تسهیلاتی و امتیازی بانک‌های ایران با امتیازدهی شفاف، محاسبه اقساط و تحلیل بازده حقیقی نسبت به تورم. داده‌ها از بانک مرکزی، سایت بانک‌ها و مراجع مقایسه‌ای گردآوری و خودکار به‌روزرسانی می‌شود." />
  <meta name="keywords" content="وام, سپرده, نرخ سود بانکی, کارت اعتباری, قرض‌الحسنه, وام ازدواج, وام فرزندآوری, مقایسه بانک‌ها, بازده حقیقی, تورم" />
  <meta name="author" content="بانک‌رادار" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fa_IR" />
  <meta property="og:site_name" content="بانک‌رادار" />
  <meta property="og:url" content="https://alib11.github.io/-/" />
  <meta property="og:title" content="بانک‌رادار | مقایسه حرفه‌ای محصولات بانکی ایران" />
  <!--
    عدد محصول و بانک عمداً در فراداده ثابت نمی‌آید: داده هر روز خودکار
    به‌روزرسانی می‌شود و عدد ثابت، کهنه و گمراه‌کننده می‌شد. شمار واقعی به‌صورت
    زنده در بخش قهرمان صفحه (heroHTML) نمایش داده می‌شود.
  -->
  <meta property="og:description" content="مقایسه و رتبه‌بندی محصولات منابعی، اعتباری، تسهیلاتی و امتیازی بانک‌های ایران با امتیازدهی شفاف، محاسبه اقساط و تحلیل بازده حقیقی نسبت به تورم؛ داده‌ها هر روز خودکار بازبینی می‌شوند." />
  <!--
    کارت توییتر بدون تصویر: این مخزن هیچ دارایی تصویری ندارد و اعلام
    summary_large_image بدون og:image باعث می‌شود شبکه‌های اجتماعی کارت
    شکسته نشان دهند. تا زمانی که تصویر اشتراک‌گذاری ساخته نشده، summary
    مقدار صادقانه است.
  -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="بانک‌رادار | مقایسه حرفه‌ای محصولات بانکی ایران" />
  <meta name="twitter:description" content="مقایسه و رتبه‌بندی محصولات بانکی ایران با امتیازدهی شفاف و تعدیل نرخ حقیقی نسبت به تورم." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232fe0a8'/%3E%3Ctext y='72' x='50' text-anchor='middle' font-size='58' font-family='Tahoma'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body>
  <a class="skip-link" href="#main">پرش به محتوای اصلی</a>

  <header class="topbar">
    <a class="brand" href="./" aria-label="بانک‌رادار — صفحه اصلی">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <span class="brand-text">
        <b>بانک‌رادار</b>
        <span>مقایسه محصولات بانکی ایران</span>
      </span>
    </a>

    <div class="topbar-search">
      <span class="icon" aria-hidden="true">⌕</span>
      <label class="visually-hidden" for="global-search">جست‌وجو در بانک، محصول، توضیحات</label>
      <input
        id="global-search"
        type="text"
        placeholder="جست‌وجو: وام ازدواج، سپرده ۲۳٪، قرض‌الحسنه، بلوبانک…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <div class="topbar-actions">
      <button class="btn btn--ghost btn--sm" type="button" data-action="open-method">
        <span aria-hidden="true">؟</span><span class="lbl">روش امتیازدهی</span>
      </button>
      <button class="btn btn--ghost btn--sm" type="button" data-action="open-data">
        <span aria-hidden="true">◍</span><span class="lbl">مرکز داده</span>
      </button>
      <button class="btn btn--primary btn--sm" type="button" data-action="scroll-compare">
        مقایسه <span class="chip chip--info" style="margin-inline-start:2px" id="nav-compare-count">۰</span>
      </button>
    </div>
  </header>

  <div class="shell">
    <!-- بخش قهرمان و شاخص‌های کلان -->
    <div id="hero" aria-live="off"></div>

    <!-- نوار پرش سریع دسته‌ها -->
    <nav class="cat-tabs" id="tabs" role="tablist" aria-label="دسته‌بندی محصولات" style="margin-block-start:var(--sp-5)"></nav>

    <div class="main-grid" style="margin-block-start:var(--sp-5)">
      <div id="filters"></div>

      <main class="main" id="main">
        <p class="visually-hidden" id="result-count" role="status" aria-live="polite"></p>
        <div id="toolbar"></div>

        <div id="loading" class="cards">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>

        <div class="cards" id="cards"></div>
        <div id="rank"></div>
        <div id="compare"></div>
        <div id="charts"></div>
      </main>
    </div>

    <div id="footer"></div>
  </div>

  <!-- کشوی جزئیات محصول -->
  <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="جزئیات محصول" aria-hidden="true"></aside>

  <!-- گفتگوهای مرکز داده و روش امتیازدهی -->
  <div class="modal-backdrop" id="data-modal" role="presentation"></div>
  <div class="modal-backdrop" id="method-modal" role="presentation"></div>

  <!-- اعلان‌ها -->
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <!-- وضعیت راه‌اندازی برای صفحه‌خوان‌ها -->
  <p class="visually-hidden" id="boot-status" role="status" aria-live="polite"></p>

  <!--
    داده درون‌خطی: این فایل توسط tools/build-bundle.mjs ساخته می‌شود.
    بارگذاری با تگ script انتخاب شده تا سامانه روی file:// هم (که fetch به دلیل CORS
    شکست می‌خورد) به‌درستی کار کند. در محیط وب، assets/js/store.js نسخه تازه‌تر
    data/products.json را در پس‌زمینه جایگزین می‌کند.
  -->
  <script src="data/bundle.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
