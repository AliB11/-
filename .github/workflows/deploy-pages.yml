name: انتشار روی GitHub Pages

on:
  # به‌روزرسانی خودکار داده روی همین شاخه commit می‌کند، پس همان push برای
  # انتشار کافی است؛ افزودن workflow_run باعث دو انتشار هم‌زمان می‌شد.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: آماده‌سازی بسته انتشار
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # پوسته bash با pipefail: اگر لوله‌ای در مراحل ساخت باشد (مثل find | sort)،
    # شکست بخش اول پنهان نمی‌ماند.
    defaults:
      run:
        shell: bash

    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v7
        with:
          ref: main

      - name: راه‌اندازی Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: اعتبارسنجی داده پیش از انتشار
        run: node scripts/validate-data.mjs

      - name: بازسازی بسته داده
        run: node tools/build-bundle.mjs

      - name: آماده‌سازی پوشه انتشار
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r assets dist/
          mkdir -p dist/data
          cp data/products.json data/banks.json data/indicators.json data/meta.json data/bundle.js data/schema.json dist/data/
          touch dist/.nojekyll
          echo "محتوای بسته انتشار:"
          find dist -type f | sort

      - name: تنظیم GitHub Pages
        uses: actions/configure-pages@v5

      - name: بارگذاری بسته
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: انتشار
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: انتشار روی GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
